name: Build Binary GeoSite Dat

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build-dat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 初始化 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 初始化 Go 语言环境
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.20'

      - name: 4. 解析 Gist 并转换为编译输入格式
        env:
          LOCAL_LIST_URL: ${{ secrets.LOCAL_LIST_URL }}
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
        run: python generate.py

      - name: 5. 编译并压制生成二进制 geosite.dat
        run: |
          # 克隆工具源码并进入目录
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git compiler
          cd compiler
          
          # 将 Python 脚本清洗出的本地文本复制到编译器的 data 目录
          cp -r ../geosite/* ./data/
          
          # 🌟 修正此处参数：将 -outputfilename 改为 -outputname
          go run main.go --outputdir=../ --outputname=geosite.dat

      - name: 6. 清理残留并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 移除临时生成的文本目录和编译器源码
          rm -rf geosite compiler
          
          # 此时仓库里只会存在全新压制出的二进制 geosite.dat 文件
          git add geosite.dat
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动压制二进制 GeoSite $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
            echo ">> 二进制 dat 文件已成功部署。"
          else
            echo ">> 内容无变化，跳过。"
          fi
