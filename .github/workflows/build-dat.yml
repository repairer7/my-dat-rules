name: Update Mihomo Rules

on:
  schedule:
    # 每天北京时间早上 6 点 (UTC 时间晚上 10 点) 自动运行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许你在网页端手动点击按钮触发

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 运行脚本生成 .dat 文件
        env:
          # 将 GitHub Secrets 映射为环境变量，供 Python 脚本读取
          LOCAL_LIST_URL: ${{ secrets.LOCAL_LIST_URL }}
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
        run: python generate.py

      - name: 提交并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add local.dat proxy.dat
          
          # 检查是否有文件变动，如果有则提交并推送
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update rules: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push
          else
            echo "规则未发生变化，无需提交。"
          fi
