name: Build Separate Binary Dats

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build-dats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. 初始化 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 初始化 Go 语言环境
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.20'

      - name: 4. 执行脚本转换规则文本
        env:
          LOCAL_LIST_URL: ${{ secrets.LOCAL_LIST_URL }}
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
        run: |
          # 转换直连与代理规则
          python generate.py
          # 🌟 转换并提取 AdGuardHome 广告规则
          python adguardhome.py

      - name: 5. 分别编译并压制三份二进制 Dat 文件
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git compiler
          cd compiler
          
          # 第一次编译：压制生成 local.dat
          if [ -d "../temp_local/data" ]; then
            go run main.go --datapath=../temp_local/data --outputdir=../ --outputname=local.dat
          fi
          
          # 第二次编译：压制生成 proxy.dat
          if [ -d "../temp_proxy/data" ]; then
            go run main.go --datapath=../temp_proxy/data --outputdir=../ --outputname=proxy.dat
          fi
          
          # 🌟 第三次编译：压制生成全新的广告 adguardhome.dat
          if [ -d "../temp_adguardhome/data" ]; then
            go run main.go --datapath=../temp_adguardhome/data --outputdir=../ --outputname=adguardhome.dat
          fi

      - name: 6. 清理残留并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 清除所有临时文本目录与编译器
          rm -rf temp_local temp_proxy temp_adguardhome compiler
          
          # 暂存所有生成的二进制单文件
          git add local.dat proxy.dat adguardhome.dat
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动压制独立二进制(含AdGuardHome) Dat 文件 $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
            echo ">> 所有二进制 .dat 文件已更新并成功推送。"
          else
            echo ">> 内容无任何变化，跳过本次推送。"
          fi
