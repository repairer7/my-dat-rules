name: Build Binary GeoSite Dat

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build-dat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 初始化 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 解析 Gist 并转换为编译输入格式
        env:
          LOCAL_LIST_URL: ${{ secrets.LOCAL_LIST_URL }}
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
        run: python generate.py

      - name: 4. 下载官方 v2ray-rules-dat 编译工具
        run: |
          # 下载 v2geo 编译器
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/v2geo-linux-amd64
          mv v2geo-linux-amd64 v2geo
          chmod +x v2geo

      - name: 5. 压制生成二进制 geosite.dat
        run: |
          # 编译命令：将 geosite 目录下的文本压缩为二进制单文件 geosite.dat
          ./v2geo site

      - name: 6. 清理残留并推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 移除不需要提交的临时文本目录和工具
          rm -rf geosite v2geo
          
          # 此时仓库里只会产生一个完全加密、二进制的 geosite.dat 文件
          git add geosite.dat
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动压制二进制 GeoSite $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
            echo ">> 二进制 dat 文件已成功部署。"
          else
            echo ">> 内容无变化，跳过。"
          fi
