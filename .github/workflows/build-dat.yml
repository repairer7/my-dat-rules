name: Automatic Rules Deploy

on:
  schedule:
    # 每天北京时间早上 06:00 (UTC 22:00) 自动触发
    - cron: '0 22 * * *'
  workflow_dispatch: # 支持在 GitHub 页面上手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 🌟 关键修正：强行赋予该工作流对仓库内容的写入权限
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 执行 Python 脚本清洗并生成规则
        env:
          # 从 GitHub Secrets 安全地映射 URL，代码里完全不可见
          LOCAL_LIST_URL: ${{ secrets.LOCAL_LIST_URL }}
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
        run: python generate.py

      - name: 4. 检查变动并自动推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存生成的两个文件
          git add local.dat proxy.dat
          
          # 检查是否有内容更新，防止无意义的提交
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动更新规则列表 $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
            echo ">> 规则已更新并成功推送至仓库。"
          else
            echo ">> 检测到规则内容无任何变化，跳过本次推送。"
          fi
